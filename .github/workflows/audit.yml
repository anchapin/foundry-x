name: audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "**/requirements*.txt"
  schedule:
    # Weekly: Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: pip-audit (supply-chain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: uv pip audit
        # `uv pip audit` was removed in uv 0.9.x; use `uvx pip-audit`
        # which runs the canonical PyPA tool via uv's ephemeral env.
        # Pinned to 2.10.1 (2026-07-26): without a pin, `uvx` resolves the
        # latest pip-audit on every run, so a breaking release could
        # silently flip which advisories fire or exit non-zero and block
        # legitimate PRs. See issue #983 and ADR-0002.
        run: uvx --from "pip-audit==2.10.1" pip-audit
