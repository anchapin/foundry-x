name: rocm

on:
  pull_request:
    paths:
      - "infra/llama-cpp/**"
      - ".github/workflows/rocm.yml"
  push:
    branches: [develop]

jobs:
  rocm-check:
    name: ROCm pre-flight check (issue #637)
    runs-on: self-hosted-rocm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ROCm pre-flight check
        run: infra/llama-cpp/rocm_setup.sh --check-rocm
