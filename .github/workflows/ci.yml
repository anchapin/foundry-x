name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  conflict-markers:
    name: detect conflict markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Check for conflict markers
        run: |
          echo "Checking for merge conflict markers in changed files..."
          markers=$(uv run rg --hidden --no-heading --line-number '<<<<<<< |=======|>>>>>>> ' HEAD ^develop 2>/dev/null | head -50)
          if [ -n "$markers" ]; then
            echo "ERROR: Merge conflict markers found:"
            echo "$markers"
            exit 1
          fi
          echo "No conflict markers found."

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Harness load check
        run: uv run python harness/scripts/load_check.py

      - name: Pytest (non-benchmark + JUnit XML)
        run: |
          mkdir -p test-results
          uv run pytest -m "not benchmark" --junit-xml=test-results/junit.xml

      - name: Upload JUnit XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-xml-ci
          path: test-results/junit.xml
