name: test

on:
  pull_request:

jobs:
  test:
    name: pytest (non-benchmark)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Harness load check
        run: uv run python harness/scripts/load_check.py

      - name: Pytest (non-benchmark)
        run: |
          mkdir -p test-results
          uv run pytest -n auto -m "not benchmark" --junit-xml=test-results/junit.xml

      - name: Upload JUnit XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-xml-test
          path: test-results/junit.xml

  detect-benchmark-changes:
    name: detect benchmark changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      run: ${{ steps.check-changes.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for benchmark-relevant changes
        id: check-changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '(benchmarks/|src/foundry_x/(execution|trace|evolution)/|tests/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: pytest (benchmark only)
    runs-on: ubuntu-latest
    needs: detect-benchmark-changes
    if: needs.detect-benchmark-changes.outputs.run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Pytest (benchmark only)
        run: |
          mkdir -p test-results
          uv run pytest -n auto -m benchmark --junit-xml=test-results/junit.xml

      - name: Upload JUnit XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-xml-benchmark
          path: test-results/junit.xml

  test-real-model:
    name: pytest (real model integration)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.OPENCODE_SERVER_URL != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (hash-verified)
        uses: ./.github/actions/install-uv

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Harness load check
        run: uv run python harness/scripts/load_check.py

      - name: Pytest (real model integration)
        env:
          TEST_MODEL_MODE: real
          OPENCODE_SERVER_URL: ${{ secrets.OPENCODE_SERVER_URL }}
          FOUNDRY_MODEL_API_KEY: ${{ secrets.FOUNDRY_MODEL_API_KEY }}
        run: |
          mkdir -p test-results
          uv run pytest -n auto -m "not benchmark" --junit-xml=test-results/junit.xml

      - name: Upload JUnit XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-xml-test-real-model
          path: test-results/junit.xml
